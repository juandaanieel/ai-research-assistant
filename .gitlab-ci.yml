image: python:3.12-slim

stages: [test, deploy]

before_script:
  - python -m pip install uv==0.12.10
  - uv sync --locked

test:
  stage: test
  script:
    - uv run python -m pytest
    - uv run python -m research_agent.site 'examples/neon-qubit/Research/Projects/Project index.md' --output dist --label 'Fictional example'
  artifacts:
    paths: [dist/]

deploy-pages:
  stage: deploy
  before_script: []
  needs:
    - job: test
      artifacts: true
  script:
    - mv dist public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
